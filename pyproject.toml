[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iran-legal-engine-demo"
version = "0.1.0"
description = "Portfolio-grade, review-first legal document versioning prototype"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<2", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
